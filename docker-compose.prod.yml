# docker-compose.prod.yml — WORKSTATION BUILD overlay only.
# Production never runs compose from a host checkout. There is no current
# source tree on prod (and other nodes do not have /opt/comserv/Comserv).
# Prod starts via `docker pull` + `docker run` of this image (deploy.sh
# start_prod_container_from_image). CSS/JS are baked into the image.
# Only theme override volumes overlay two mutable static subdirs.

services:
  config-db:
    image: mariadb:10.11
    container_name: comserv2-config-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-comserv}
      MARIADB_USER: ${MARIADB_USER:-comserv}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    volumes:
      - comserv2_config_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: comserv2-redis
    restart: unless-stopped
    volumes:
      - comserv2_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: shantamcsbain/comserv-web-prod:latest
    container_name: comserv2-web-prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 5000
      CATALYST_ENV: production
      CATALYST_DEBUG: 0
      WEB_PORT: 5000
      TZ: UTC
      COMSERV_NO_HEALTH_LOG: 1
      NFS_DATA_PATH: /data/nfs
      COMSERV_LOG_DIR: /opt/comserv/root/log
      DISABLE_FILE_LOGGING: "1"
      COMSERV_LOG_MIN_LEVEL: "WARN"
      DB_LOG_MIN_LEVEL: "WARN"
      COMSERV_SESSION_DIR: /tmp/comserv/session
      COMSERV_SESSION_COOKIE: comserv_session
      DB_HOST: ${DB_HOST:-192.168.1.20}
      DB_PORT: ${DB_PORT:-3307}
      DB_NAME: ${DB_NAME:-ency}
      SYSTEM_IDENTIFIER: ${SYSTEM_IDENTIFIER:-workstation-prod-local}
    ports:
      - "5000:5000"
    volumes:
      - ${COMSERV_SECRETS_DIR:-~/.comserv/secrets}:/home/comserv/.comserv/secrets:ro
      # Standardized comserv2_* cache volume
      - comserv2_cache:/cache:rw
      # Standardized comserv2_* volumes
      - comserv2_logs:/opt/comserv/root/log
      - comserv2_nfs_data:/data/nfs:rw
      - comserv2_sessions:/tmp/comserv/session:rw
      - comserv2_cache:/tmp/comserv/cache
      - comserv2_temp:/tmp/comserv/temp
      - comserv2_themes:/opt/comserv/root/themes
      # The two MUTABLE subdirs of the static tree must be writable + persistent
      # so theme_definitions.json and generated theme CSS survive redeploys
      # without a host bind (which shadows the baked assets / makes them :ro).
      # Both stay INSIDE root/static, so no code-path change is needed. Seed once
      # from the image-baked root/static/config/theme_definitions.json at deploy.
      - comserv2_theme_config:/opt/comserv/root/static/config
      - comserv2_theme_css:/opt/comserv/root/static/css/themes
      - comserv2_whisper_venv:/opt/comserv/whisper_venv
      - comserv2_cpan_cache:/root/.cpan
      # Static assets (CSS/JS/images) are baked into the image at build time
      # under /opt/comserv/root/static. Do NOT bind-mount a host dir over them:
      # the prod host /root/static is empty and shadows the baked assets, which
      # breaks ALL CSS. The image's static tree serves directly.
      # (Workstation dev can re-enable via STATIC_SRC if live-editing is needed.)
      - ${LEGACY_STATIC_SRC:-/root/LegacyStaticPages}:/opt/comserv/root/LegacyStaticPages
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 3 http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Workstation siblings from docker-compose.yml. A bare `compose up -d` with
  # this overlay used to start all three on production (same image, ports
  # 3000/4000/5000) and steal :5000 from web-prod. The profile keeps them off
  # any host that uses this overlay unless COMPOSE_PROFILES=workstation-only.
  web:
    profiles: ["workstation-only"]
  web-dev:
    profiles: ["workstation-only"]
  web-staging:
    profiles: ["workstation-only"]

# NOTE: Volumes are defined in docker-compose.yml (base compose) only.
# No volume definitions here to avoid conflicting parameters
# (driver: local vs external: true) when merging compose files.
# All volumes are pre-created by ensure_all_required_volumes* methods
# before docker compose up runs.
