<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- USBM green — theme-compliant with the usbm.ca family (primary-color #009933) -->
  <rect width="32" height="32" rx="4" fill="#009933"/>
  <!-- 3D printer gantry: top rail -->
  <rect x="4" y="5" width="24" height="2.4" rx="1.2" fill="white" opacity="0.85"/>
  <!-- Print head (nozzle) carriage on the rail -->
  <rect x="12.5" y="6" width="7" height="7" rx="1.2" fill="white"/>
  <!-- Nozzle tip -->
  <path d="M14.8 13 L17.2 13 L16 16.4 Z" fill="white"/>
  <!-- Extruded filament dot / printed layer -->
  <circle cx="16" cy="18.6" r="1.3" fill="#FFCC66"/>
  <!-- Printed layers building up -->
  <rect x="11" y="21" width="10" height="2" rx="0.8" fill="white" opacity="0.9"/>
  <rect x="13" y="24.4" width="6" height="2" rx="0.8" fill="white" opacity="0.65"/>
  <!-- Build plate -->
  <rect x="6" y="27.4" width="20" height="1.8" rx="0.9" fill="white" opacity="0.5"/>
</svg>
