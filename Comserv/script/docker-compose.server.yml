services:
  web-prod:
    image: shantamcsbain/comserv-web-prod:latest
    container_name: comserv2-web-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      CATALYST_ENV: production
      CATALYST_DEBUG: 0
      WEB_PORT: 5000
      TZ: UTC
      COMSERV_NO_HEALTH_LOG: 1
      NFS_DATA_PATH: /data/nfs
      WORKSHOP_RESOURCES_PATH: /data/nfs
      NFS_ROOT: /data/nfs
      COMSERV_LOG_DIR: /opt/comserv/applogs
      DISABLE_FILE_LOGGING: "1"
      COMSERV_LOG_MIN_LEVEL: "WARN"
      DB_LOG_MIN_LEVEL: "WARN"
      COMSERV_SESSION_DIR: /tmp/comserv/session
      COMSERV_SESSION_COOKIE: comserv_session
      SYSTEM_IDENTIFIER: ${SYSTEM_IDENTIFIER:-production1}
      # Token the external monitoring cron (hardware_monitor.pl) sends to the
      # /admin/hardware_monitor/* endpoints. Must match the host cron's
      # HW_INGEST_TOKEN. Change 'changeme' to a real shared secret in .env.
      HW_INGEST_TOKEN: ${HW_INGEST_TOKEN:-changeme}
      # Reachable app endpoint(s) the monitoring cron curls. NOT localhost — the
      # cron runs on a separate host and targets the container's real LAN address.
      # Ordered by preference for this server (production1 first).
      HW_MONITOR_NODES: ${HW_MONITOR_NODES:-http://192.168.1.126:5000/admin/hardware_monitor/run,http://192.168.1.199:5000/admin/hardware_monitor/run}
      TTYD_HOST_PORT: "7682"
      # Ollama address for THIS deployment. Overrides comserv.conf <Ollama> host
      # ONLY if set. Leave unset so the app auto-probes the fastest reachable
      # address: comserv.conf host (192.168.1.199 LAN) first, then fallback_host
      # (172.30.131.126 ZeroTier). production1 is on the same LAN, so it uses the
      # fast unencrypted LAN path and only falls back to ZeroTier if the LAN IP
      # is unreachable. Set OLLAMA_HOST in .env to pin a specific address.
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/.comserv/secrets:/home/comserv/.comserv/secrets:ro
      - ${COMSERV_LOGS_DIR:-/var/log/comserv}:/opt/comserv/applogs
      # Shared NFS storage — the ONE source of truth for uploads/voice files.
      # NFS-backed named volume (see volumes: below) pointing at the same export
      # root the workstation uses. Replaces the old local bind mount that made
      # /data/nfs ephemeral per-host (voice files never reached shared storage).
      - comserv2_nfs_data:/data/nfs:rw
      - /home/ubuntu/comserv-sessions:/tmp/comserv/session:rw
      # Live Perl fixes from host git (deploy.sh pulls /opt/comserv/Comserv before compose up)
      - /opt/comserv/Comserv/lib:/opt/comserv/lib:ro
      # Host ttyd status + start requests (shared with script/ttyd_comserv_start.sh on production1)
      - /opt/comserv/Comserv/var:/opt/comserv/var:rw
      - whisper-venv:/opt/comserv/whisper_venv:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || curl -f http://127.0.0.1:5000/health || curl -g -6 -f http://[::1]:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  whisper-venv:
    driver: local
  # Shared NFS storage for /data/nfs — same export root as the workstation
  # (192.168.1.175:/mnt/data), so every container + host share one tree
  # (bmaster/audio, bmaster/transcripts, workshop files). nfsvers=3 matches
  # the workstation's live, proven mount.
  comserv2_nfs_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.175,rw,nfsvers=3,hard,timeo=600,retrans=2"
      device: ":/mnt/data"
