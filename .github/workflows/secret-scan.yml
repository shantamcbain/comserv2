name: secret-scan

# Blocks secret/key files and gitleaks hits on every push and PR (all branches).
# Uses the same Comserv/script/git/secret_guard.sh as the local git hooks:
# file-name rules + raw-key heuristics + gitleaks with .gitleaks.toml,
# honoring .secret-guard-allow. Make "secret-scan / scan" a required status
# check in branch protection so merges are blocked until it passes.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Work out commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD"); tip="$PR_HEAD"
          else
            tip="$AFTER"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              # new branch: scan only what it adds on top of main
              git fetch -q origin main || true
              base=$(git merge-base "$tip" origin/main 2>/dev/null || true)
            else
              base="$BEFORE"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tip=$tip"   >> "$GITHUB_OUTPUT"
          echo "Scanning ${base:-<root>}..$tip"

      - name: Secret guard
        env:
          SECRET_GUARD_REQUIRE_GITLEAKS: "1"
        run: |
          bash Comserv/script/git/secret_guard.sh --range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.tip }}"
